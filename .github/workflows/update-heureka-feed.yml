name: Update Heureka XML feed

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: heureka-feed
  cancel-in-progress: false

jobs:
  update-heureka-feed:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check schedule window
        id: timecheck
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run - bypassing schedule window"
            exit 0
          fi

          HOUR=$(TZ="Europe/Prague" date +"%H")
          MINUTE=$(TZ="Europe/Prague" date +"%M")

          echo "Europe/Prague time: ${HOUR}:${MINUTE}"

          if [ "$HOUR" -ge 6 ] && [ "$HOUR" -le 22 ] && [ $((10#$HOUR % 2)) -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Scheduled run allowed"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping scheduled run"
          fi

      - name: Checkout repository
        if: steps.timecheck.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: steps.timecheck.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate Heureka XML feed
        if: steps.timecheck.outputs.run == 'true'
        env:
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
        run: |
          node scripts/generate-heureka-feed.mjs

          echo "Generated files:"
          ls -lah
          ls -lah public || true

          if [ ! -f public/heureka.xml ]; then
            echo "public/heureka.xml was not generated"
            exit 1
          fi

      - name: Copy feed to repository root
        if: steps.timecheck.outputs.run == 'true'
        run: |
          cp public/heureka.xml heureka.xml

          echo "Root feed file:"
          ls -lah heureka.xml

          echo "First lines:"
          head -n 5 heureka.xml

      - name: Commit updated heureka.xml
        if: steps.timecheck.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git status
          git add heureka.xml

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update Heureka XML feed"
          git push
