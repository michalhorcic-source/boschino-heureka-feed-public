name: Update Heureka XML feed

on:
  schedule:
    # GitHub cron běží v UTC.
    # V letním čase GMT+2 to odpovídá Praze: 06:17 až 22:17 každé 2 hodiny.
    - cron: "17 4,6,8,10,12,14,16,18,20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: heureka-feed-and-pages
  cancel-in-progress: false

jobs:
  update-heureka-feed:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Generate Heureka XML feed
        env:
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
        run: |
          node scripts/generate-heureka-feed.mjs

          echo "Generated files:"
          ls -lah
          ls -lah public || true

          if [ ! -f public/heureka.xml ]; then
            echo "public/heureka.xml was not generated"
            exit 1
          fi

      - name: Copy feed to repository root
        run: |
          cp public/heureka.xml heureka.xml

          echo "Root feed file:"
          ls -lah heureka.xml

          echo "First lines:"
          head -n 5 heureka.xml

          echo "File hash:"
          sha256sum heureka.xml

      - name: Commit updated Heureka XML feed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Git status before add:"
          git status --short

          git add heureka.xml

          echo "Git diff cached:"
          git diff --cached --stat || true

          if git diff --cached --quiet; then
            echo "No changes to commit - heureka.xml is identical to the current repository version."
            echo "Continuing to Pages deploy with current files."
            exit 0
          fi

          git commit -m "Update Heureka XML feed"
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy-pages:
    needs: update-heureka-feed
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
