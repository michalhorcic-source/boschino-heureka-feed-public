name: Generate Heureka XML feed

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: heureka-feed
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest

    outputs:
      run_feed: ${{ steps.schedule.outputs.run_feed }}

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check local Prague schedule
        id: schedule
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_feed=true" >> "$GITHUB_OUTPUT"
            echo "Manual run - generating feed now"
            exit 0
          fi

          HOUR="$(TZ=Europe/Prague date +'%H')"
          MINUTE="$(TZ=Europe/Prague date +'%M')"

          echo "Local Prague time: ${HOUR}:${MINUTE}"

          # GitHub scheduled workflows are not guaranteed to start exactly at the cron minute.
          # Therefore we validate only the Prague hour, not the exact minute.
          if [ "${HOUR}" -ge 6 ] && [ "${HOUR}" -le 22 ] && [ $((10#$HOUR % 2)) -eq 0 ]; then
            echo "run_feed=true" >> "$GITHUB_OUTPUT"
            echo "Scheduled run allowed for Prague even hour"
          else
            echo "run_feed=false" >> "$GITHUB_OUTPUT"
            echo "Skipping - outside Prague schedule window"
          fi

      - name: Checkout repository
        if: steps.schedule.outputs.run_feed == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        if: steps.schedule.outputs.run_feed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Heureka XML
        if: steps.schedule.outputs.run_feed == 'true'
        env:
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
        run: |
          node scripts/generate-heureka-feed.mjs

          echo "Generated files:"
          ls -lah
          ls -lah public || true

          if [ ! -f public/heureka.xml ]; then
            echo "public/heureka.xml was not generated"
            exit 1
          fi

          echo "First lines of generated feed:"
          head -n 5 public/heureka.xml

      - name: Copy Heureka XML to repository root
        if: steps.schedule.outputs.run_feed == 'true'
        shell: bash
        run: |
          cp public/heureka.xml heureka.xml

          echo "Root feed file:"
          ls -lah heureka.xml

          echo "First lines of root feed:"
          head -n 5 heureka.xml

      - name: Commit updated heureka.xml
        if: steps.schedule.outputs.run_feed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git status --short
          git add heureka.xml

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Heureka XML feed"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Upload Pages artifact
        if: steps.schedule.outputs.run_feed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy-pages:
    needs: generate-and-publish
    if: needs.generate-and-publish.outputs.run_feed == 'true'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
