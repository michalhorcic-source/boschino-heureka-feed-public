name: Update Heureka XML feed

on:
  schedule:
    # GitHub cron bezi v UTC.
    # Workflow se spusti kazdou hodinu a uvnitr zkontroluje cas Europe/Prague.
    - cron: "0 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-heureka-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Check schedule window
        id: timecheck
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run - bypassing schedule window"
            exit 0
          fi

          HOUR=$(TZ="Europe/Prague" date +"%H")

          if [ "$HOUR" -ge 6 ] && [ "$HOUR" -le 22 ] && [ $((10#$HOUR % 2)) -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Scheduled run at Europe/Prague hour: $HOUR"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping scheduled run at Europe/Prague hour: $HOUR"
          fi
          
      - name: Checkout repository
        if: steps.timecheck.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.timecheck.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate Heureka XML feed
        if: steps.timecheck.outputs.run == 'true'
        env:
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
        run: |
          node scripts/generate-heureka-feed.mjs

      - name: Commit updated heureka.xml
        if: steps.timecheck.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ ! -f public/heureka.xml ]; then
            echo "public/heureka.xml was not generated"
            exit 1
          fi

          cp public/heureka.xml heureka.xml

          if git diff --quiet -- heureka.xml; then
            echo "No changes to commit"
            exit 0
          fi

          git add heureka.xml
          git commit -m "Update Heureka XML feed"
          git push
